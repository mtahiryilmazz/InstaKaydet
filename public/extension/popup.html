<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>InstaFlow İndirici</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .badge {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
    }
    .tip {
      font-size: 11px;
      color: #71717a;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">PRO</span>
    <div>
      <div class="title">InstaFlow İndirici</div>
      <div style="font-size: 11px; color: #a1a1aa;">400+ Gönderi & PDF ZIP Arşivi</div>
    </div>
  </div>

  <div class="box">
    <div style="margin-bottom: 6px; font-weight: 600; color: #34d399;">✓ Aktif Tarayıcı Oturumu</div>
    <div class="tip">
      Instagram sekmesinde profil sayfasına gidin (örn: <code>instagram.com/dkabcikpsslianne</code>). Sağ altta beliren InstaFlow butonuna basarak tüm gönderileri kota sınırı olmadan tarayın.
    </div>
  </div>

  <button id="openWebBtn" class="btn">
    🌐 InstaFlow Web Uygulamasını Aç
  </button>
  <button id="guideBtn" class="btn btn-secondary">
    📖 Kullanım Kılavuzu
  </button>

  <script src="popup.js"></script>
</body>
</html>
